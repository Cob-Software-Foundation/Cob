name: Secure TCC Ingestion & Attested Build

on:
  schedule:
    - cron: '0 0 * * *' # Pulls from repo.or.cz every day at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write # Required for CodeQL analysis reporting

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          # FIX 1: Explicitly fetch all history to prevent push rejections
          fetch-depth: 0 

      - name: Ingest Upstream TCC Source
        run: |
          mkdir -p src/tcc
          # Clone directly from the official upstream server
          git clone --depth 1 https://repo.or.cz/tinycc.git temp-tcc
          # Sync and overwrite files, leaving your core app intact
          rsync -av --delete --exclude='.git' temp-tcc/ src/tcc/
          rm -rf temp-tcc

      # --- SECURITY SHIELD ---
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'c-cpp'
          queries: security-extended,security-and-quality

      - name: Attempt Build (Required for CodeQL C/C++ analysis)
        run: |
          cd src/tcc
          ./configure
          make

      - name: Perform CodeQL Static Scan
        uses: github/codeql-action/analyze@v3

      # --- ATTESTATION & COMMIT TRACKING ---
      - name: Archive Verified Production Binary
        run: |
          mkdir -p dist
          # FIX 2: Ensure the binary target matches the exact compilation output
          cp src/tcc/tcc dist/my-verified-tcc

      - name: Generate Build Attestation
        # FIX 3: Updated to the correct marketplace action tag version v2
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/my-verified-tcc'

      - name: Commit Fresh Upstream Changes to History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # FIX 4: Explicitly pull remote changes to handle any midnight race conditions
          git pull --rebase origin ${{ github.ref_name }}
          
          git add src/tcc
          
          # Commit and push safely
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated TCC Upstream Sync - $(date +'%Y-%m-%d')"
            git push origin HEAD:${{{ github.ref_name }}}
          else
            echo "No changes detected in TCC upstream. Skipping commit."
          fi
