name: Secure TCC Ingestion & Attested Build

on:
  schedule:
    - cron: '0 0 * * *' # Pulls from repo.or.cz every day at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write # Required for CodeQL analysis reporting

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Ingest Upstream TCC Source
        run: |
          mkdir -p src/tcc
          # Clone directly from the official upstream server
          git clone --depth 1 https://repo.or.cz/tinycc.git
           temp-tcc
          # Sync and overwrite files, leaving your core app intact
          rsync -av --delete --exclude='.git' temp-tcc/ tcc-src/
          rm -rf temp-tcc

      # --- SECURITY SHIELD ---
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'c-cpp'
          queries: security-extended,security-and-quality

      - name: Attempt Build (Required for CodeQL C/C++ analysis)
        run: |
          cd src/tcc
          ./configure
          make

      - name: Perform CodeQL Static Scan
        uses: github/codeql-action/analyze@v3
        # If CodeQL finds a backdoor or major vulnerability, the pipeline 
        # stops immediately and refuses to issue a release or attestation.

      # --- ATTESTATION & COMMIT TRACKING ---
      - name: Archive Verified Production Binary
        run: |
          # Copy your final compiled binary to a release staging folder
          mkdir -p dist
          cp src/tcc/tcc dist/my-verified-tcc

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/my-verified-tcc'

      - name: Commit Fresh Upstream Changes to History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tcc
          git diff-index --quiet HEAD || git commit -m "Automated TCC Upstream Sync - $(date +'%Y-%m-%d')"
          git push
