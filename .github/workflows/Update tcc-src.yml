name: Secure TCC Ingestion & Attested Build

on:
  schedule:
    - cron: '0 0 * * *' # Checks upstream repo.or.cz every day at midnight
  workflow_dispatch: # Allows manual trigger

# Minimal permissions: this job no longer force-pushes straight to main
# in a single step, but `create-pull-request` below still needs
# `contents: write` to push its own side branch. The real backstop
# against unreviewed code landing on main is a branch protection rule
# on `main` requiring PR review before merge -- permissions here can't
# enforce that by themselves, so please turn that on in repo Settings.
permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write # Required for CodeQL analysis reporting
  pull-requests: write    # Required to open the sync PR

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Ingest Upstream TCC Source
        run: |
          mkdir -p src/tcc
          # Clone directly from the official upstream server.
          # NOTE: this is an unpinned `--depth 1` clone of whatever HEAD
          # currently is on repo.or.cz -- there is no tag/commit pin or
          # checksum verification here. That means the diff reviewed in
          # the resulting PR (see below) IS the security control: nobody
          # should merge this PR without actually reading what changed.
          git clone --depth 1 https://repo.or.cz/tinycc.git temp-tcc
          # Sync and overwrite files, leaving your core app intact
          rsync -av --delete --exclude='.git' temp-tcc/ src/tcc/
          rm -rf temp-tcc

      # --- SECURITY SHIELD ---
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'c-cpp'
          queries: security-extended,security-and-quality

      - name: Attempt Build (Required for CodeQL C/C++ analysis)
        run: |
          cd src/tcc
          ./configure
          make

      - name: Perform CodeQL Static Scan
        uses: github/codeql-action/analyze@v3

      # --- ATTESTATION ---
      # This attests "GitHub Actions built this artifact from this repo
      # state" -- it is build provenance, not a claim that the vendored
      # TCC source itself has been audited. Read it as "here's proof of
      # what the CI produced," not as a security clearance for the code.
      - name: Archive Verified Production Binary
        run: |
          mkdir -p dist
          cp src/tcc/tcc dist/my-verified-tcc

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/my-verified-tcc'

      # --- OPEN A PULL REQUEST INSTEAD OF PUSHING TO main ---
      # Nothing lands on `main` without a human reviewing the diff. This
      # action only opens/updates a PR when there's an actual content
      # change under src/tcc -- if upstream didn't change, no PR is
      # created and this step is a no-op.
      - name: Open pull request with upstream changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: src/tcc
          commit-message: "Automated TCC upstream sync"
          branch: automated/tcc-upstream-sync
          delete-branch: true
          title: "Automated TCC upstream sync (repo.or.cz/tinycc)"
          body: |
            Nightly sync from `https://repo.or.cz/tinycc.git` into `src/tcc/`.

            **This is an unpinned upstream clone (no tag/commit/checksum
            verification).** Please review the diff before merging --
            this PR is the review gate, not a formality.

            CodeQL results for this run: see the Security tab.