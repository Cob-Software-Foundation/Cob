name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------
  # Smoke test: build cob natively on Linux and run it against a
  # known-good .cob sample, asserting on stdout.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Build cob (native)
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -Iinclude \
            -o cob src/file_io.c src/cob_interp.c

    - name: Run pop() smoke test
      run: |
        cat > smoke.cob << 'EOF'
        pop("smoke test ok")
        EOF
        ./cob smoke.cob | tee out.txt
        grep -qx "smoke test ok" out.txt

    - name: Run fast-boot cache smoke test
      run: |
        test -f smoke.strawberry
        ./cob smoke.cob | tee out2.txt
        grep -qx "smoke test ok" out2.txt

  # ---------------------------------------------------------------------
  # Cross-platform build matrix.
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      # Bundled into each release so popcorn_comp works standalone with
      # no separate Zig install -- see the "Download and bundle Zig"
      # step below and src/popcorn_comp.c's find_bundled_zig_cc().
      # Bump this to pick up newer Zig releases; verify the exact
      # filenames still match https://ziglang.org/download/ first, as
      # Zig's release naming has changed between versions before.
      ZIG_VERSION: "0.16.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-amd64
            zig_target: x86_64-windows
            zig_ext: zip

          - goos: windows
            goarch: '386'
            runner: ubuntu-latest
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-386
            zig_target: x86-windows
            zig_ext: zip

          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-arm64
          # windows/arm (32-bit ARM) intentionally not supported -- cut
          # per project decision.

          # ---------------- Linux ----------------
            zig_target: aarch64-windows
            zig_ext: zip

          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            toolchain: native
            cc: gcc
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-amd64
            zig_target: x86_64-linux
            zig_ext: tarxz

          - goos: linux
            goarch: '386'
            runner: ubuntu-latest
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-386
            zig_target: x86-linux
            zig_ext: tarxz

          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm64
            zig_target: aarch64-linux
            zig_ext: tarxz

          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm32

          # ---------------- macOS ----------------
            zig_target: arm-linux
            zig_ext: tarxz

          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-arm64
            zig_target: aarch64-macos
            zig_ext: tarxz

          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-amd64
            zig_target: x86_64-macos
            zig_ext: tarxz

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      if: matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install llvm-mingw (Windows arm64)
      if: matrix.toolchain == 'llvm-mingw'
      run: |
        LLVM_MINGW_VERSION="20260421"
        LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
        tar xf llvm-mingw.tar.xz
        echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

    - name: Compile cob, farmer, and popcorn_comp
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.output_name }}" \
          src/file_io.c src/cob_interp.c

        # farmer needs vendor/miniz (statically-linked zip extraction --
        # see src/farmer.c's header comment) in addition to include/,
        # unlike the other two tools.
        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude -Ivendor/miniz -D_POSIX_C_SOURCE=200809L -DMINIZ_NO_ZLIB_APIS \
          -o "dist/${{ matrix.farmer_output_name }}" \
          src/file_io.c src/farmer.c \
          vendor/miniz/miniz.c vendor/miniz/miniz_tdef.c \
          vendor/miniz/miniz_tinfl.c vendor/miniz/miniz_zip.c \
          -lm

        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.popcorn_output_name }}" \
          src/file_io.c src/popcorn_comp.c

        ls -la dist/

    # popcorn_comp itself has zero build-time dependency on any C
    # toolchain beyond the one compiling it -- it transpiles .strawberry
    # to C and spawns a real compiler AT RUNTIME (see its file-header
    # comment for the full design and honesty notes on cross-compiler
    # bundling). We can only actually *run* the smoke test where the
    # resulting popcorn_comp binary can execute, i.e. natively.
    # popcorn_comp defaults to spawning `zig cc` when no --cc/CobOS/CobArch
    # override is given (see src/popcorn_comp.c's header comment) -- the
    # smoke test below exercises exactly that default path, so Zig needs
    # to actually be installed here for it to mean anything.
    - name: Install Zig (for popcorn_comp's default compiler backend)
      if: matrix.toolchain == 'native'
      uses: mlugg/setup-zig@v2
      with:
        version: latest

    - name: Smoke test popcorn_comp end-to-end (native only)
      if: matrix.toolchain == 'native'
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        cat > smoke.cob << 'EOF'
        set x = 3
        while x > 0:
            pop("counting down")
            set x = x - 1
        pop("liftoff")
        EOF
        ./cob smoke.cob > interp_out.txt
        ./popcorn_comp smoke.strawberry -o smoke_native
        ./smoke_native > compiled_out.txt
        diff interp_out.txt compiled_out.txt && echo "popcorn_comp output matches cob_interp: OK"
        rm -f smoke.cob smoke.strawberry smoke_native interp_out.txt compiled_out.txt

    # -----------------------------------------------------------------
    # Download and bundle the real, official, host-runnable Zig
    # release for THIS target platform. This is not the toolchain used
    # to cross-build the Cob tools above (those run on the ubuntu-latest
    # runner) -- it's a copy of Zig that will actually RUN on the end
    # user's machine once they unzip this release, since popcorn_comp
    # defaults to spawning a bundled zig/zig(.exe) next to itself
    # before falling back to a system-wide Zig install (see
    # find_bundled_zig_cc() in src/popcorn_comp.c). Verified real
    # filenames against https://ziglang.org/download/ -- if this ever
    # 404s, that naming scheme has changed upstream and needs rechecking.
    # -----------------------------------------------------------------
    - name: Download and bundle Zig for popcorn_comp
      shell: bash
      run: |
        set -euo pipefail
        ZIG_BASENAME="zig-${{ matrix.zig_target }}-${ZIG_VERSION}"
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          ZIG_FILE="${ZIG_BASENAME}.zip"
        else
          ZIG_FILE="${ZIG_BASENAME}.tar.xz"
        fi
        ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_FILE}"
        echo "Fetching $ZIG_URL"
        curl -fsSL -o "zig_download.${{ matrix.zig_ext }}" "$ZIG_URL"

        mkdir -p zig_extracted
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          unzip -q "zig_download.zip" -d zig_extracted
        else
          tar xf "zig_download.tar.xz" -C zig_extracted
        fi

        mkdir -p "staging/${{ matrix.archive_name }}/zig"
        # The archive extracts to a single top-level "zig-<target>-<ver>/"
        # directory -- move its contents (the zig binary plus the lib/
        # folder it needs at runtime) into the release's zig/ folder.
        mv "zig_extracted/${ZIG_BASENAME}"/* "staging/${{ matrix.archive_name }}/zig/"
        rm -rf zig_download.${{ matrix.zig_ext }} zig_extracted

    - name: Package binary and licenses into zip
      shell: bash
      run: |
        mkdir -p staging/${{ matrix.archive_name }}
        cp dist/${{ matrix.output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.farmer_output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.popcorn_output_name }} staging/${{ matrix.archive_name }}/

        # Copy main repository license(s)
        find . -maxdepth 1 -iname "license*" -exec cp {} staging/${{ matrix.archive_name }}/ \;

        cd staging
        zip -r "../dist/${{ matrix.archive_name }}.zip" ${{ matrix.archive_name }}
        cd ..

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/${{ matrix.archive_name }}.zip

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.sha256"
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.hashfrag"

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: |
          dist/${{ matrix.archive_name }}.zip
          dist/${{ matrix.archive_name }}.zip.sha256
          dist/${{ matrix.archive_name }}.zip.hashfrag

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*