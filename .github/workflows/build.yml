name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------
  # Smoke test: build cob natively on Linux and run it against a
  # known-good .cob sample, asserting on stdout.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Build cob (native)
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -Iinclude \
            -o cob src/file_io.c src/cob_interp.c

    - name: Run pop() smoke test
      run: |
        cat > smoke.cob << 'EOF'
        pop("smoke test ok")
        EOF
        ./cob smoke.cob | tee out.txt
        grep -qx "smoke test ok" out.txt

    - name: Run fast-boot cache smoke test
      run: |
        test -f smoke.strawberry
        ./cob smoke.cob | tee out2.txt
        grep -qx "smoke test ok" out2.txt

  # ---------------------------------------------------------------------
  # Cross-platform build matrix.
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob.exe
            archive_name: cob-windows-amd64
            is_app: false
          - goos: windows
            goarch: '386'
            runner: ubuntu-latest
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob.exe
            archive_name: cob-windows-386
            is_app: false
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            output_name: cob.exe
            archive_name: cob-windows-arm64
            is_app: false
          - goos: windows
            goarch: arm
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: armv7-w64-mingw32-clang
            output_name: cob.exe
            archive_name: cob-windows-arm32
            is_app: false

          # ---------------- Linux ----------------
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            toolchain: native
            cc: gcc
            output_name: cob
            archive_name: cob-linux-amd64
            is_app: false
          - goos: linux
            goarch: '386'
            runner: ubuntu-latest
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob
            archive_name: cob-linux-386
            is_app: false
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob
            archive_name: cob-linux-arm64
            is_app: false
          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob
            archive_name: cob-linux-arm32
            is_app: false

          # ---------------- macOS (Standard Binary) ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            archive_name: cob-darwin-arm64
            is_app: false
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            archive_name: cob-darwin-amd64
            is_app: false

          # ---------------- macOS (.App Bundle) ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            archive_name: cob-darwin-arm64-app
            is_app: true
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            archive_name: cob-darwin-amd64-app
            is_app: true

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      if: matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install llvm-mingw (Windows arm64 / arm32)
      if: matrix.toolchain == 'llvm-mingw'
      run: |
        LLVM_MINGW_VERSION="20260421"
        LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
        tar xf llvm-mingw.tar.xz
        echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

    - name: Compile cob
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.output_name }}" \
          src/file_io.c src/cob_interp.c
        ls -la "dist/${{ matrix.output_name }}"

    - name: Package binary and licenses into zip
      shell: bash
      run: |
        mkdir -p staging/${{ matrix.archive_name }}
        
        if [ "${{ matrix.is_app }}" = "true" ]; then
          APP_DIR="staging/Cob.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          
          cp dist/${{ matrix.output_name }} "$APP_DIR/Contents/MacOS/cob"
          chmod +x "$APP_DIR/Contents/MacOS/cob"
          
          find . -maxdepth 1 -iname "license*" -exec cp {} "$APP_DIR/Contents/Resources/" \;
          if [ -f "tcc-src/COPYING" ]; then
            cp "tcc-src/COPYING" "$APP_DIR/Contents/Resources/TCC_COPYING"
          fi
          
          cd staging
          zip -r "../dist/${{ matrix.archive_name }}.zip" Cob.app
          cd ..
        else
          cp dist/${{ matrix.output_name }} staging/${{ matrix.archive_name }}/
          find . -maxdepth 1 -iname "license*" -exec cp {} staging/${{ matrix.archive_name }}/ \;
          if [ -f "tcc-src/COPYING" ]; then
            cp "tcc-src/COPYING" staging/${{ matrix.archive_name }}/TCC_COPYING
          fi
          
          cd staging
          zip -r "../dist/${{ matrix.archive_name }}.zip" ${{ matrix.archive_name }}
          cd ..
        fi

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/${{ matrix.archive_name }}.zip

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.sha256"
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.hashfrag"

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: |
          dist/${{ matrix.archive_name }}.zip
          dist/${{ matrix.archive_name }}.zip.sha256
          dist/${{ matrix.archive_name }}.zip.hashfrag

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*