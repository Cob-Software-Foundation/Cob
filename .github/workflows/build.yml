name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------
  # Smoke test: build cob natively on Linux and run it against a
  # known-good .cob sample, asserting on stdout.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Build cob (native)
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -Iinclude \
            -o cob src/file_io.c src/cob_interp.c

    - name: Run pop() smoke test
      run: |
        cat > smoke.cob << 'EOF'
        pop("smoke test ok")
        EOF
        ./cob smoke.cob | tee out.txt
        grep -qx "smoke test ok" out.txt

    - name: Run fast-boot cache smoke test
      run: |
        test -f smoke.strawberry
        ./cob smoke.cob | tee out2.txt
        grep -qx "smoke test ok" out2.txt

  # ---------------------------------------------------------------------
  # Cross-platform build matrix.
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob.exe
            farmer_output_name: farmer.exe
            archive_name: cob-windows-amd64
          - goos: windows
            goarch: '386'
            runner: ubuntu-latest
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob.exe
            farmer_output_name: farmer.exe
            archive_name: cob-windows-386
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            output_name: cob.exe
            farmer_output_name: farmer.exe
            archive_name: cob-windows-arm64
          - goos: windows
            goarch: arm
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: armv7-w64-mingw32-clang
            output_name: cob.exe
            farmer_output_name: farmer.exe
            archive_name: cob-windows-arm32

          # ---------------- Linux ----------------
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            toolchain: native
            cc: gcc
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-linux-amd64
          - goos: linux
            goarch: '386'
            runner: ubuntu-latest
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-linux-386
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-linux-arm64
          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-linux-arm32

          # ---------------- macOS ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-darwin-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            farmer_output_name: farmer
            archive_name: cob-darwin-amd64

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      if: matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install llvm-mingw (Windows arm64 / arm32)
      if: matrix.toolchain == 'llvm-mingw'
      run: |
        LLVM_MINGW_VERSION="20260421"
        LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
        tar xf llvm-mingw.tar.xz
        echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

    - name: Compile cob and farmer
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.output_name }}" \
          src/file_io.c src/cob_interp.c
        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.farmer_output_name }}" \
          src/file_io.c src/farmer.c
        ls -la "dist/${{ matrix.output_name }}" "dist/${{ matrix.farmer_output_name }}"

    # -----------------------------------------------------------------
    # popcorn_comp -- statically links src/tcc/libtcc.c, which needs a
    # matching libtcc1.a (TCC's own runtime archive) built for the SAME
    # target. We've only proven that build (./configure && make
    # libtcc1.a) end-to-end for native Linux so far, so that's the only
    # matrix entry this runs for right now rather than silently
    # skipping or faking cross-target support. Expanding this to the
    # other 9 targets is real follow-up work: mingw/llvm-mingw targets
    # need TCC's win32 runtime libs (src/tcc/win32/lib), and macOS
    # needs its own libtcc1.a built per-arch.
    # -----------------------------------------------------------------
    - name: Build TCC runtime (libtcc1.a) for popcorn_comp
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        cd src/tcc
        sh ./configure --prefix=/tmp/tccinstall
        make libtcc1.a

    - name: Compile popcorn_comp (native Linux amd64 only, see comment above)
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      shell: bash
      run: |
        set -euo pipefail
        gcc -std=c99 -O2 -Wall -Wextra -Iinclude -Isrc/tcc \
          -DPOPCORN_TCC_RUNTIME_DIR='"runtime"' \
          -o dist/popcorn_comp \
          src/file_io.c src/popcorn_comp.c src/tcc/libtcc.c \
          -ldl -lpthread -lm
        ls -la dist/popcorn_comp

    - name: Smoke test popcorn_comp end-to-end
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        cat > smoke.cob << 'EOF'
        set x = 3
        while x > 0:
            pop("counting down")
            set x = x - 1
        pop("liftoff")
        EOF
        ./cob smoke.cob > interp_out.txt
        # TCC needs its own include/ dir alongside libtcc1.a to resolve
        # {B}/include (see tcc.h's CONFIG_TCC_SYSINCLUDEPATHS) -- the
        # real packaged runtime/ folder isn't assembled until the
        # packaging step below, so point straight at the checked-out
        # src/tcc tree for this smoke test via the env-var override.
        POPCORN_TCC_RUNTIME_DIR="$GITHUB_WORKSPACE/src/tcc" \
          ./popcorn_comp smoke.strawberry -o smoke_native
        ./smoke_native > compiled_out.txt
        diff interp_out.txt compiled_out.txt && echo "popcorn_comp output matches cob_interp: OK"
        rm -f smoke.cob smoke.strawberry smoke_native interp_out.txt compiled_out.txt

    - name: Package binary and licenses into zip
      shell: bash
      run: |
        mkdir -p staging/${{ matrix.archive_name }}
        cp dist/${{ matrix.output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.farmer_output_name }} staging/${{ matrix.archive_name }}/
        if [ -f "dist/popcorn_comp" ]; then
          cp dist/popcorn_comp staging/${{ matrix.archive_name }}/
          # popcorn_comp looks for runtime/libtcc1.a and runtime/include/
          # next to itself by default (see POPCORN_TCC_RUNTIME_DIR in
          # src/popcorn_comp.c) -- bundle that folder so a downloaded
          # release works standalone, with no source checkout needed.
          mkdir -p staging/${{ matrix.archive_name }}/runtime/include
          cp src/tcc/libtcc1.a staging/${{ matrix.archive_name }}/runtime/
          cp -r src/tcc/include/* staging/${{ matrix.archive_name }}/runtime/include/
        fi
        
        # Copy main repository license(s)
        find . -maxdepth 1 -iname "license*" -exec cp {} staging/${{ matrix.archive_name }}/ \;
        
        # Copy src/tcc/COPYING license file (TCC is LGPL-licensed; its
        # license text must travel with any binary that links it in)
        if [ -f "src/tcc/COPYING" ]; then
          cp "src/tcc/COPYING" staging/${{ matrix.archive_name }}/TCC_COPYING
        fi
        
        cd staging
        zip -r "../dist/${{ matrix.archive_name }}.zip" ${{ matrix.archive_name }}
        cd ..

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/${{ matrix.archive_name }}.zip

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.sha256"
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.hashfrag"

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: |
          dist/${{ matrix.archive_name }}.zip
          dist/${{ matrix.archive_name }}.zip.sha256
          dist/${{ matrix.archive_name }}.zip.hashfrag

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*