name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------
  # Smoke test: build cob natively on Linux and run it against a
  # known-good .cob sample, asserting on stdout.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Build cob (native, via Makefile)
      run: |
        make cob_interp CFLAGS="-std=c99 -Wall -Wextra -Werror"
        cp bin/cob_interp cob

    - name: Run pop() smoke test
      run: |
        cat > smoke.cob << 'EOF'
        pop("smoke test ok")
        EOF
        ./cob smoke.cob | tee out.txt
        grep -qx "smoke test ok" out.txt

    - name: Run fast-boot cache smoke test
      run: |
        test -f smoke.strawberry
        ./cob smoke.cob | tee out2.txt
        grep -qx "smoke test ok" out2.txt

  # ---------------------------------------------------------------------
  # v0.0.5 extensions: SQLite3/Tcl/Tk bindings (cob_interp_db) and the
  # native-GUI _cobwindow bindings (cob_interp_window). Linux-only and
  # real X11/Tcl/Tk builds here -- this is exactly the job that would
  # have caught both the vendor/sqlite-vs-vendor/SQLite casing bug and
  # the vendor/TK/unix-vs-vendor/TK/win mismatch documented in
  # Release.txt, had it existed sooner.
  # ---------------------------------------------------------------------
  test_extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install X11 dev headers + Xvfb (for Tk and _cobwindow)
      run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

    - name: Build plain cob_interp (must stay dependency-free)
      run: make cob_interp

    - name: Build SQLite + Tcl + Tk, then cob_interp_db
      run: make sqlite tcl tk cob_interp_db

    - name: Build cob_interp_window (no vendor deps, just X11)
      run: make cob_interp_window

    - name: Smoke test -- plain cob_interp stubs out the new keywords
      run: |
        set -euo pipefail
        cat > stub.cob << 'EOF'
        _MakeCache = False
        set h = sql_open("stub.db")
        pop("h=" + h)
        EOF
        ./bin/cob_interp stub.cob 2> stub_err.txt | tee stub_out.txt
        grep -qx "h=0" stub_out.txt
        grep -q "stub in this build" stub_err.txt

    - name: Smoke test -- cob_interp_db against real SQLite + Tcl
      run: |
        set -euo pipefail
        export TCL_LIBRARY="$(pwd)/vendor/TCL/library"
        cat > db.cob << 'EOF'
        _MakeCache = False
        set h = sql_open("db.sqlite")
        set rc = sql_exec(h, "CREATE TABLE t (name TEXT)")
        set rc = sql_exec(h, "INSERT INTO t VALUES ('cob')")
        set name = sql_query(h, "SELECT name FROM t LIMIT 1")
        pop("name=" + name)
        set rc = sql_close(h)
        pop("answer=" + tcl_eval("expr {6*7}"))
        EOF
        ./bin/cob_interp_db db.cob | tee db_out.txt
        grep -qx "name=cob" db_out.txt
        grep -qx "answer=42" db_out.txt

    - name: Smoke test -- cob_interp_window opens a real X11 window
      run: |
        set -euo pipefail
        Xvfb :99 -screen 0 800x600x24 &
        sleep 1
        cat > win.cob << 'EOF'
        _MakeCache = False
        shuck cobwindow
        set h = window_open("CI smoke test")
        set rc = window_label(h, "hello from CI")
        set rc = window_wait(h, 1)
        set rc = window_close(h)
        pop("window handle=" + h)
        EOF
        DISPLAY=:99 ./bin/cob_interp_window win.cob | tee win_out.txt
        grep -qx "window handle=1" win_out.txt

    # v0.0.5-plus-widgets: window_button/window_slider/window_textbox
    # bumped the .strawberry cache format to COBSTRW6 (see the header
    # comment above write_expr()/read_expr() in src/cob_interp.c). This
    # is the job that would catch a broken write_expr/read_expr pair
    # for the three new expression kinds -- run once to write the
    # cache, then again to force a cache hit, and diff the two runs'
    # output. A mismatch here means the AST round-trip through the
    # cache is lossy for one of the new widget keywords.
    - name: Smoke test -- .strawberry cache round-trips the new widget expression kinds
      run: |
        set -euo pipefail
        cat > widgets_cache.cob << 'EOF'
        shuck cobwindow
        set h = window_open("cache test")
        set b = window_button(h, "OK")
        set s = window_slider(h, "vol", 50)
        set t = window_textbox(h, "name")
        pop("b=" + b + " s=" + s + " t=" + t)
        set rc = window_close(h)
        EOF
        DISPLAY=:99 ./bin/cob_interp_window widgets_cache.cob | tee cache_run1.txt
        test -f widgets_cache.strawberry
        grep -qx "b=0 s=0 t=" cache_run1.txt
        DISPLAY=:99 ./bin/cob_interp_window widgets_cache.cob | tee cache_run2.txt
        diff cache_run1.txt cache_run2.txt
        echo "cache round-trip OK: window_button/window_slider/window_textbox decode identically from a cached AST"

  # ---------------------------------------------------------------------
  # v0.0.5 extensions on Windows: cross-build via mingw-w64 to catch
  # regressions in the win/-tree paths (vendor/TCL/win, vendor/TK/win,
  # the xlib shim, STATIC_BUILD, stub-lib linking, WINDOW_LIBS). Can
  # only verify the build here, not execution -- there's no Windows
  # runner in this job, and no display to open a real window on even
  # if there were. See Release.txt for what's been verified vs. not.
  # ---------------------------------------------------------------------
  test_extensions_windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Cross-build cob_interp_window (no vendor deps)
      run: |
        make OS=Windows_NT CC=x86_64-w64-mingw32-gcc cob_interp_window
        file bin/cob_interp_window.exe | grep -q "PE32+"

    - name: Cross-build SQLite + Tcl + Tk + cob_interp_db
      run: |
        set -euo pipefail
        make OS=Windows_NT CC=x86_64-w64-mingw32-gcc \
          TCL_CONFIGURE="cd vendor/TCL/win && CC=x86_64-w64-mingw32-gcc sh ./configure --host=x86_64-w64-mingw32 --build=x86_64-linux-gnu --disable-shared --enable-64bit" \
          TK_CONFIGURE="cd vendor/TK/win && CC=x86_64-w64-mingw32-gcc sh ./configure --host=x86_64-w64-mingw32 --build=x86_64-linux-gnu --disable-shared --enable-64bit --with-tcl=$(pwd)/vendor/TCL/win" \
          sqlite tcl tk cob_interp_db
        file bin/cob_interp_db.exe | grep -q "PE32+"

  # ---------------------------------------------------------------------
  # Cross-platform build matrix.
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      # Bundled into each release so popcorn_comp works standalone with
      # no separate Zig install -- see the "Download and bundle Zig"
      # step below and src/popcorn_comp.c's find_bundled_zig_cc().
      # Bump this to pick up newer Zig releases; verify the exact
      # filenames still match https://ziglang.org/download/ first, as
      # Zig's release naming has changed between versions before.
      ZIG_VERSION: "0.16.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            ar: x86_64-w64-mingw32-ar
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-amd64
            zig_target: x86_64-windows
            zig_ext: zip
            full_build: true

          - goos: windows
            goarch: '386'
            runner: ubuntu-latest
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            ar: i686-w64-mingw32-ar
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-386
            zig_target: x86-windows
            zig_ext: zip
            full_build: true

          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            ar: aarch64-w64-mingw32-ar
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-arm64
            zig_target: aarch64-windows
            zig_ext: zip
            full_build: true
          # windows/arm (32-bit ARM) intentionally not supported -- cut
          # per project decision.

          # ---------------- Linux ----------------
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            toolchain: native
            cc: gcc
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-amd64
            zig_target: x86_64-linux
            zig_ext: tarxz
            full_build: true

          - goos: linux
            goarch: '386'
            runner: ubuntu-latest
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-386
            zig_target: x86-linux
            zig_ext: tarxz
            full_build: true
            x11_arch: i386

          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm64
            zig_target: aarch64-linux
            zig_ext: tarxz
            full_build: true
            x11_arch: arm64

          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            ar: arm-linux-gnueabihf-ar
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm32
            zig_target: arm-linux
            zig_ext: tarxz
            full_build: true
            x11_arch: armhf

          # ---------------- macOS ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-arm64
            zig_target: aarch64-macos
            zig_ext: tarxz
            full_build: true

          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-amd64
            zig_target: x86_64-macos
            zig_ext: tarxz
            full_build: true

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      if: matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install X11/OpenGL dev headers (full build, native Linux only)
      if: matrix.full_build == true && matrix.goos == 'linux'
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Install llvm-mingw (Windows arm64)
      if: matrix.toolchain == 'llvm-mingw'
      run: |
        LLVM_MINGW_VERSION="20260421"
        LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
        tar xf llvm-mingw.tar.xz
        echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

    - name: Install X11/OpenGL dev headers (full build, native Linux)
      if: matrix.full_build == true && matrix.goos == 'linux' && matrix.x11_arch == null
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Install X11/OpenGL dev headers (full build, foreign-arch Linux)
      if: matrix.full_build == true && matrix.goos == 'linux' && matrix.x11_arch != null
      # i386 (matrix.x11_arch on the linux/386 entry) is confirmed
      # working -- i386 packages are still served from the same
      # archive.ubuntu.com/security.ubuntu.com mirrors as amd64, so no
      # extra source needed. arm64/armhf are a different situation:
      # Ubuntu only serves those from ports.ubuntu.com, never from the
      # main archive/security mirrors at all, and this sandbox's own
      # network policy blocks ports.ubuntu.com outright, so this
      # exact step could never be tested here end-to-end.
      #
      # First real run against this surfaced two things that armchair
      # review missed: (1) GitHub's ubuntu-24.04 runners default to
      # the newer deb822 /etc/apt/sources.list.d/ubuntu.sources format,
      # not the classic one-line-per-entry sources.list this step
      # originally only appended to -- that part still worked (apt
      # reads both), but (2) the *default* archive.ubuntu.com/
      # security.ubuntu.com stanzas in ubuntu.sources have no
      # Architectures: restriction, so once `dpkg --add-architecture
      # arm64` runs, apt tries *every* configured suite -- including
      # noble-security -- against those default mirrors too, and gets
      # a 404 for binary-arm64/Packages there (arm64 was never on
      # those mirrors to begin with; only ports.ubuntu.com has it).
      # Restricting the default stanzas to amd64/i386 stops apt from
      # ever trying them for a foreign arch, and the dedicated
      # ports.ubuntu.com source below now covers all four suites
      # (main/updates/backports/security), not just the two this step
      # originally had.
      run: |
        sudo dpkg --add-architecture ${{ matrix.x11_arch }}
        if [ "${{ matrix.x11_arch }}" != "i386" ]; then
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64 i386' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.list > /dev/null << 'PORTS_EOF'
        deb [arch=arm64,armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse
        deb [arch=arm64,armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse
        deb [arch=arm64,armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports noble-backports main universe restricted multiverse
        deb [arch=arm64,armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse
        PORTS_EOF
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libx11-dev:${{ matrix.x11_arch }} libgl1-mesa-dev:${{ matrix.x11_arch }} \
          libxrandr-dev:${{ matrix.x11_arch }} libxinerama-dev:${{ matrix.x11_arch }} \
          libxcursor-dev:${{ matrix.x11_arch }} libxi-dev:${{ matrix.x11_arch }}

    - name: Compile cob, farmer, and popcorn_comp (via Makefile)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        # Same three targets the old raw-gcc step compiled by hand,
        # now built through the project's own Makefile instead of a
        # second, separately-maintained copy of the same flags. This
        # was worth doing after the .strawberry-magic bug (see
        # Release.txt) -- that bug was exactly this workflow's own
        # gcc invocations quietly drifting from what the Makefile
        # (and every contributor's local `make`) actually builds.
        #
        # EXE_SUF is explicitly forced here rather than left to the
        # Makefile's own $(OS) check, and this is not cosmetic: the
        # Makefile's check only ever reads Windows_NT on a *native*
        # Windows host, so on this Linux runner it's always empty --
        # but a mingw cross-compiler targeting Windows silently
        # appends .exe to whatever output name it's given anyway
        # (confirmed by actually reproducing the mingw build locally;
        # `-o bin/cob_interp` really does write bin/cob_interp.exe to
        # disk). Passing EXE_SUF=.exe here makes the name Make asks
        # the compiler for match the name that compiler actually
        # writes, instead of asking for one name and getting a
        # different one back.
        EXE_SUF=""
        if [ "${{ matrix.goos }}" = "windows" ]; then EXE_SUF=".exe"; fi

        if [ "${{ matrix.full_build }}" = "true" ]; then
          # This target ships cob_interp_full (SQLite + _cobwindow +
          # raygui widgets) as its "cob"/"cob.exe", not the lightweight
          # cob_interp. Confidence varies a lot by target -- see the
          # per-OS notes below and Release.txt for what was actually
          # cross-compiled and run versus just written to match a
          # proven pattern:
          #   - windows/amd64, windows/386, linux/amd64, linux/386:
          #     built AND run (headless Xvfb for the two Linux ones)
          #     in the same sandbox that verified the rest of this
          #     workflow -- SQLite + a real window both confirmed
          #     working through the actual output binary.
          #   - windows/arm64 (llvm-mingw): built and inspected (a
          #     real PE32+ Aarch64 binary with correct imports), not
          #     run -- no way to execute an arm64 Windows binary in
          #     this sandbox.
          #   - linux/arm64, linux/arm (cross): NOT built here at all.
          #     This sandbox's own network policy blocks
          #     ports.ubuntu.com outright, which is where the
          #     foreign-arch X11/OpenGL dev packages these need
          #     actually live -- a real GitHub Actions runner should
          #     reach it fine, but that makes this workflow's first
          #     real run the first real test for these two targets.
          #   - darwin/arm64, darwin/amd64: NOT built here at all --
          #     this sandbox has no macOS toolchain or frameworks to
          #     build against, full stop. The Makefile's Darwin branch
          #     (WINDOW_LIBS/SQLITE_LIB) was added from raylib's own
          #     documented OSX Makefile requirements, not from a
          #     successful build. If it's wrong, the Makefile comment
          #     next to it explains the expected failure mode is a
          #     loud link error, not a silently broken binary.
          #
          # CFLAGS is deliberately NOT overridden anywhere in this
          # branch -- cob_interp_full recurses into raylib's own
          # vendored Makefile via $(MAKE), and GNU Make auto-forwards
          # any command-line-origin variable into every recursive
          # sub-make, so a CFLAGS override here doesn't just add to
          # raylib's own internal flags, it silently *replaces* them,
          # which is exactly how raylib decides its GLFW backend
          # (confirmed directly: doing this reproduced raylib being
          # built with the wrong backend for the target, failing at
          # final link with a wall of `undefined reference to
          # GetTime/InitPlatform/...` even though raylib itself
          # compiled with zero errors). Anything matrix.cflags would
          # have supplied (-m32, -arch arm64, ...) is folded into CC
          # itself instead, the same way EXE_SUF handles the mingw
          # auto-.exe-append quirk -- a value baked into CC applies to
          # every invocation of it, in this Makefile and in raylib's,
          # without needing CFLAGS at all.
          #
          # PLATFORM_OS/WINDOW_LIBS/SQLITE_LIB are forced explicitly
          # for Windows and Linux for the same reason EXE_SUF is: both
          # this Makefile's and raylib's own vendored Makefile's
          # platform branches are keyed on the *build host*
          # ($(OS)/`uname`), never on the actual cross-compile target,
          # so cross-building for Windows (or a foreign Linux arch)
          # from this x86_64 runner needs every one of these forced by
          # hand instead of auto-detected. macOS is the one goos here
          # that's never cross-compiled -- the real macos-latest
          # runner invokes `make` natively, so both Makefiles' own
          # `uname`-based Darwin detection already works unassisted,
          # and only the -arch flag (folded into CC below) is needed
          # to pick the right side of Apple's universal toolchain.
          FULL_CC="${{ matrix.cc }} ${{ matrix.cflags || '' }}"
          FULL_AR="${{ matrix.ar || '' }}"
          case "${{ matrix.goos }}" in
            windows)
              WINDOW_LIBS="-lopengl32 -lgdi32 -lwinmm -lshell32"
              SQLITE_LIB_OVERRIDE="vendor/SQLite/libsqlite3-win.a"
              PLATFORM_OS_OVERRIDE="WINDOWS"
              ;;
            linux)
              WINDOW_LIBS="-lGL -lm -lpthread -ldl -lrt -lX11"
              SQLITE_LIB_OVERRIDE="vendor/SQLite/libsqlite3-unix.a"
              PLATFORM_OS_OVERRIDE="LINUX"
              ;;
            darwin)
              # No PLATFORM_OS/WINDOW_LIBS/SQLITE_LIB override at all --
              # native `uname`-based detection in both Makefiles
              # already picks the Darwin branch correctly here.
              WINDOW_LIBS=""
              SQLITE_LIB_OVERRIDE=""
              PLATFORM_OS_OVERRIDE=""
              ;;
          esac

          # Build up the override list as an array instead of one long
          # string, so an empty value (FULL_AR on every target except
          # the three that need it; every *_OVERRIDE on darwin) is
          # simply omitted instead of passed to `make` as a literal
          # empty assignment.
          FULL_BUILD_ARGS=(CC="$FULL_CC" EXE_SUF="$EXE_SUF")
          [ -n "$FULL_AR" ] && FULL_BUILD_ARGS+=(AR="$FULL_AR")
          [ -n "$WINDOW_LIBS" ] && FULL_BUILD_ARGS+=(WINDOW_LIBS="$WINDOW_LIBS")
          [ -n "$SQLITE_LIB_OVERRIDE" ] && FULL_BUILD_ARGS+=(SQLITE_LIB="$SQLITE_LIB_OVERRIDE")
          [ -n "$PLATFORM_OS_OVERRIDE" ] && FULL_BUILD_ARGS+=(PLATFORM_OS="$PLATFORM_OS_OVERRIDE")

          make cob_interp_full "${FULL_BUILD_ARGS[@]}"

          # farmer/popcorn_comp don't touch any vendor sub-make, so
          # overriding CFLAGS for them is fine -- same as the non-
          # full_build branch below.
          make farmer popcorn_comp \
            CC="${{ matrix.cc }}" \
            CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
            EXE_SUF="$EXE_SUF"

          cp "bin/cob_interp_full${EXE_SUF}" "dist/${{ matrix.output_name }}"
        else
          make cob_interp farmer popcorn_comp \
            CC="${{ matrix.cc }}" \
            CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
            EXE_SUF="$EXE_SUF"

          cp "bin/cob_interp${EXE_SUF}" "dist/${{ matrix.output_name }}"
        fi

        # The Makefile's own binary names (farmer/popcorn_comp) differ
        # from the shorter names this workflow's release archives
        # actually ship (farmer[.exe]/popcorn_comp[.exe]) -- rename on
        # the way into dist/ rather than renaming what `make` itself
        # calls its own output.
        cp "bin/farmer${EXE_SUF}"       "dist/${{ matrix.farmer_output_name }}"
        cp "bin/popcorn_comp${EXE_SUF}" "dist/${{ matrix.popcorn_output_name }}"

        ls -la dist/

    # popcorn_comp itself has zero build-time dependency on any C
    # toolchain beyond the one compiling it -- it transpiles .strawberry
    # to C and spawns a real compiler AT RUNTIME (see its file-header
    # comment for the full design and honesty notes on cross-compiler
    # bundling). We can only actually *run* the smoke test where the
    # resulting popcorn_comp binary can execute, i.e. natively.
    # popcorn_comp defaults to spawning `zig cc` when no --cc/CobOS/CobArch
    # override is given (see src/popcorn_comp.c's header comment) -- the
    # smoke test below exercises exactly that default path, so Zig needs
    # to actually be installed here for it to mean anything.
    - name: Install Zig (for popcorn_comp's default compiler backend)
      if: matrix.toolchain == 'native'
      uses: mlugg/setup-zig@v2
      with:
        version: latest

    - name: Smoke test popcorn_comp end-to-end (native only)
      if: matrix.toolchain == 'native'
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        cat > smoke.cob << 'EOF'
        set x = 3
        while x > 0:
            pop("counting down")
            set x = x - 1
        pop("liftoff")
        EOF
        ./cob smoke.cob > interp_out.txt
        ./popcorn_comp smoke.strawberry -o smoke_native
        ./smoke_native > compiled_out.txt
        diff interp_out.txt compiled_out.txt && echo "popcorn_comp output matches cob_interp: OK"
        rm -f smoke.cob smoke.strawberry smoke_native interp_out.txt compiled_out.txt

    # -----------------------------------------------------------------
    # Download and bundle the real, official, host-runnable Zig
    # release for THIS target platform. This is not the toolchain used
    # to cross-build the Cob tools above (those run on the ubuntu-latest
    # runner) -- it's a copy of Zig that will actually RUN on the end
    # user's machine once they unzip this release, since popcorn_comp
    # defaults to spawning a bundled zig/zig(.exe) next to itself
    # before falling back to a system-wide Zig install (see
    # find_bundled_zig_cc() in src/popcorn_comp.c). Verified real
    # filenames against https://ziglang.org/download/ -- if this ever
    # 404s, that naming scheme has changed upstream and needs rechecking.
    # -----------------------------------------------------------------
    - name: Download and bundle Zig for popcorn_comp
      shell: bash
      run: |
        set -euo pipefail
        ZIG_BASENAME="zig-${{ matrix.zig_target }}-${ZIG_VERSION}"
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          ZIG_FILE="${ZIG_BASENAME}.zip"
        else
          ZIG_FILE="${ZIG_BASENAME}.tar.xz"
        fi
        ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_FILE}"
        echo "Fetching $ZIG_URL"
        curl -fsSL -o "$ZIG_FILE" "$ZIG_URL"

        mkdir -p zig_extracted
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          unzip -q "$ZIG_FILE" -d zig_extracted
        else
          tar xf "$ZIG_FILE" -C zig_extracted
        fi

        mkdir -p "staging/${{ matrix.archive_name }}/zig"
        # The archive extracts to a single top-level "zig-<target>-<ver>/"
        # directory -- move its contents (the zig binary plus the lib/
        # folder it needs at runtime) into the release's zig/ folder.
        mv "zig_extracted/${ZIG_BASENAME}"/* "staging/${{ matrix.archive_name }}/zig/"
        rm -rf "$ZIG_FILE" zig_extracted

    - name: Package binary and licenses into zip
      shell: bash
      run: |
        mkdir -p staging/${{ matrix.archive_name }}
        cp dist/${{ matrix.output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.farmer_output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.popcorn_output_name }} staging/${{ matrix.archive_name }}/

        # Copy legal folder contents next to the binaries if it exists
        if [ -d "legal" ]; then
          cp -r legal/* staging/${{ matrix.archive_name }}/
        fi

        # Download docs index.html into a docs folder next to cob.exe
        mkdir -p staging/${{ matrix.archive_name }}/docs
        curl -fsSL -o "staging/${{ matrix.archive_name }}/docs/index.html" "https://github.com/Cob-Software-Foundation/Cob-Docs/raw/refs/heads/main/index.html"

        # Copy main repository license(s)
        find . -maxdepth 1 -iname "license*" -exec cp {} staging/${{ matrix.archive_name }}/ \;

        cd staging
        zip -r "../dist/${{ matrix.archive_name }}.zip" ${{ matrix.archive_name }}
        cd ..

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/${{ matrix.archive_name }}.zip

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.sha256"
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.hashfrag"

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        path: |
          dist/${{ matrix.archive_name }}.zip
          dist/${{ matrix.archive_name }}.zip.sha256
          dist/${{ matrix.archive_name }}.zip.hashfrag

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*