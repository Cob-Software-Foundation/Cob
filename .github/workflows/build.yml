name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Smoke test: build cob_interp natively on Linux and run it against a
  # known-good .cob sample, asserting on stdout. This is our stand-in for
  # `go test ./...` -- C has no built-in test runner, so we assert output
  # by hand.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Build cob_interp (native)
      run: |
        gcc -std=c99 -Wall -Wextra -Werror -Iinclude \
            -o cob_interp src/file_io.c src/cob_interp.c

    - name: Run pop() smoke test
      run: |
        cat > smoke.cob << 'EOF'
        pop("smoke test ok")
        EOF
        ./cob_interp smoke.cob | tee out.txt
        grep -qx "smoke test ok" out.txt

    - name: Run fast-boot cache smoke test
      run: |
        test -f smoke.strawberry
        ./cob_interp smoke.cob | tee out2.txt
        grep -qx "smoke test ok" out2.txt

  # ---------------------------------------------------------------------
  # Cross-platform build matrix.
  #
  # Unlike Go, C has no single toolchain that targets every OS/arch pair,
  # so `runner` and `cc` vary per matrix entry:
  #   - Linux targets  -> ubuntu-latest, apt-installed cross-gcc
  #   - Windows targets-> ubuntu-latest, mingw-w64 (amd64/386) or
  #                       llvm-mingw (arm64/arm32, which mingw-w64's gcc
  #                       does not support)
  #   - macOS targets  -> macos-latest (Apple Silicon runner), using
  #                       clang's -arch flag to produce both arm64 and
  #                       amd64 binaries from the one official SDK.
  #                       (Cross-compiling macOS binaries from Linux
  #                       requires the Apple SDK, which Apple's license
  #                       does not permit shipping/using outside macOS
  #                       hardware -- so darwin targets always run here.)
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob_interp-windows-amd64.exe
          - goos: windows
            goarch: '386'
            runner: ubuntu-latest
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob_interp-windows-x86.exe
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            output_name: cob_interp-windows-arm64.exe
          - goos: windows
            goarch: arm
            runner: ubuntu-latest
            toolchain: llvm-mingw
            cc: armv7-w64-mingw32-clang
            output_name: cob_interp-windows-arm32.exe

          # ---------------- Linux ----------------
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            toolchain: native
            cc: gcc
            output_name: cob_interp-linux-amd64
          - goos: linux
            goarch: '386'
            runner: ubuntu-latest
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob_interp-linux-x86
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob_interp-linux-arm64
          - goos: linux
            goarch: arm
            runner: ubuntu-latest
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob_interp-linux-arm32

          # ---------------- macOS ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob_interp-mac-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob_interp-mac-amd64

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install mingw-w64 cross toolchain
      if: matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install llvm-mingw (Windows arm64 / arm32)
      if: matrix.toolchain == 'llvm-mingw'
      run: |
        LLVM_MINGW_VERSION="20260421"
        LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        curl -fsSL -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.tar.xz"
        tar xf llvm-mingw.tar.xz
        echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"

    - name: Compile cob_interp
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }} \
          -Iinclude \
          -o "dist/${{ matrix.output_name }}" \
          src/file_io.c src/cob_interp.c
        ls -la "dist/${{ matrix.output_name }}"

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.output_name }}" > "${{ matrix.output_name }}.sha256"
        # NOTE: extension is deliberately NOT .txt -- checksums.txt itself
        # would match a "*.txt" cleanup glob and get deleted by its own
        # combine step (see Stitch Checksums Document).
        sha256sum "${{ matrix.output_name }}" > "${{ matrix.output_name }}.hashfrag"

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.output_name }}
        path: |
          dist/${{ matrix.output_name }}
          dist/${{ matrix.output_name }}.sha256
          dist/${{ matrix.output_name }}.hashfrag

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*
