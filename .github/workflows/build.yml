name: Cob

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------
  # Cross-platform build matrix (build only, no tests).
  # ---------------------------------------------------------------------
  build:
    runs-on: ${{ matrix.runner }}
    env:
      # Bundled into each release so popcorn_comp works standalone with
      # no separate Zig install -- see the "Download and bundle Zig"
      # step below and src/popcorn_comp.c's find_bundled_zig_cc().
      # Bump this to pick up newer Zig releases; verify the exact
      # filenames still match https://ziglang.org/download/ first.
      ZIG_VERSION: "0.16.0"
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - goos: windows
            goarch: amd64
            runner: windows-2022
            toolchain: mingw
            cc: x86_64-w64-mingw32-gcc
            ar: x86_64-w64-mingw32-ar
            apt_pkg: gcc-mingw-w64-x86-64
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-amd64
            zig_target: x86_64-windows
            zig_ext: zip
            full_build: true

          - goos: windows
            goarch: '386'
            runner: windows-2022
            toolchain: mingw
            cc: i686-w64-mingw32-gcc
            ar: i686-w64-mingw32-ar
            apt_pkg: gcc-mingw-w64-i686
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-386
            zig_target: x86-windows
            zig_ext: zip
            full_build: true

          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            toolchain: llvm-mingw
            cc: aarch64-w64-mingw32-clang
            ar: aarch64-w64-mingw32-ar
            output_name: cob.exe
            farmer_output_name: farmer.exe
            popcorn_output_name: popcorn_comp.exe
            archive_name: cob-windows-arm64
            zig_target: aarch64-windows
            zig_ext: zip
            full_build: true
          # windows/arm (32-bit ARM) intentionally not supported.

          # ---------------- Linux ----------------
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            toolchain: native
            cc: gcc
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-amd64
            zig_target: x86_64-linux
            zig_ext: tarxz
            full_build: true

          # Cross-arch Linux builds are intentionally not full X11 builds on
          # the ubuntu-latest runner because apt multiarch setup on the same host
          # creates libgcc/libx11 version conflicts. Keep them as minimal builds.
          - goos: linux
            goarch: '386'
            runner: ubuntu-24.04
            toolchain: multilib
            cc: gcc
            cflags: "-m32"
            apt_pkg: gcc-multilib
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-386
            zig_target: x86-linux
            zig_ext: tarxz
            full_build: false

          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
            apt_pkg: gcc-aarch64-linux-gnu
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm64
            zig_target: aarch64-linux
            zig_ext: tarxz
            full_build: false

          - goos: linux
            goarch: arm
            runner: ubuntu-24.04-arm
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            ar: arm-linux-gnueabihf-ar
            apt_pkg: gcc-arm-linux-gnueabihf
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-linux-arm32
            zig_target: arm-linux
            zig_ext: tarxz
            full_build: false

          # ---------------- macOS ----------------
          - goos: darwin
            goarch: arm64
            runner: macos-14
            toolchain: clang-arch
            cc: clang
            cflags: "-arch arm64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-arm64
            zig_target: aarch64-macos
            zig_ext: tarxz
            full_build: true

          - goos: darwin
            goarch: amd64
            runner: macos-13
            toolchain: clang-arch
            cc: clang
            cflags: "-arch x86_64"
            output_name: cob
            farmer_output_name: farmer
            popcorn_output_name: popcorn_comp
            archive_name: cob-darwin-amd64
            zig_target: x86_64-macos
            zig_ext: tarxz
            full_build: true

    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true

    - name: Install Windows build tools
      if: matrix.goos == 'windows'
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ matrix.toolchain }}" = "llvm-mingw" ]; then
          LLVM_MINGW_VERSION="20260421"
          LLVM_MINGW_DIST="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-windows-x86_64"
          curl -fsSL -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIST}.zip"
          unzip -q llvm-mingw.zip
          echo "$PWD/${LLVM_MINGW_DIST}/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        choco install mingw --no-progress -y
        echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

    - name: Install mingw-w64 cross toolchain
      if: matrix.goos == 'linux' && matrix.toolchain == 'mingw'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install 32-bit multilib toolchain
      if: matrix.goos == 'linux' && matrix.toolchain == 'multilib'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install Linux cross toolchain
      if: matrix.goos == 'linux' && matrix.toolchain == 'cross'
      run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

    - name: Install X11/OpenGL dev headers (full build, native Linux only)
      if: matrix.full_build == true && matrix.goos == 'linux'
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends \
          libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    - name: Compile cob, farmer, and popcorn_comp (via Makefile)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist

        # EXE_SUF is forced explicitly: the Makefile's $(OS) check only
        # reads Windows_NT on a native Windows host, but a mingw
        # cross-compiler appends .exe to the output name anyway.
        EXE_SUF=""
        if [ "${{ matrix.goos }}" = "windows" ]; then EXE_SUF=".exe"; fi

        if [ "${{ matrix.full_build }}" = "true" ]; then
          FULL_CC="${{ matrix.cc }} ${{ matrix.cflags || '' }}"
          FULL_AR="${{ matrix.ar || '' }}"
          case "${{ matrix.goos }}" in
            windows)
              WINDOW_LIBS="-lopengl32 -lgdi32 -lwinmm -lshell32"
              SQLITE_LIB_OVERRIDE="vendor/SQLite/libsqlite3-win.a"
              PLATFORM_OS_OVERRIDE="WINDOWS"
              ;;
            linux)
              WINDOW_LIBS="-lGL -lm -lpthread -ldl -lrt -lX11"
              SQLITE_LIB_OVERRIDE="vendor/SQLite/libsqlite3-unix.a"
              PLATFORM_OS_OVERRIDE="LINUX"
              ;;
            darwin)
              WINDOW_LIBS=""
              SQLITE_LIB_OVERRIDE=""
              PLATFORM_OS_OVERRIDE=""
              ;;
          esac

          FULL_BUILD_ARGS=(CC="$FULL_CC" EXE_SUF="$EXE_SUF")
          [ -n "$FULL_AR" ] && FULL_BUILD_ARGS+=(AR="$FULL_AR")
          [ -n "$WINDOW_LIBS" ] && FULL_BUILD_ARGS+=(WINDOW_LIBS="$WINDOW_LIBS")
          [ -n "$SQLITE_LIB_OVERRIDE" ] && FULL_BUILD_ARGS+=(SQLITE_LIB="$SQLITE_LIB_OVERRIDE")
          [ -n "$PLATFORM_OS_OVERRIDE" ] && FULL_BUILD_ARGS+=(PLATFORM_OS="$PLATFORM_OS_OVERRIDE")

          make cob_interp_full "${FULL_BUILD_ARGS[@]}"

          make embed "${FULL_BUILD_ARGS[@]}" EMBED_SUF="-${{ matrix.goos }}-${{ matrix.goarch }}"
          cp bin/cob-*-embed-*.zip "dist/"

          make farmer popcorn_comp \
            CC="${{ matrix.cc }}" \
            CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
            EXE_SUF="$EXE_SUF"

          cp "bin/cob_interp_full${EXE_SUF}" "dist/${{ matrix.output_name }}"

          if [ -f include/drm_pubkey.h ]; then
            mkdir -p dist/enterprise
            make cob_interp_full ENTERPRISE=1 "${FULL_BUILD_ARGS[@]}"
            make embed ENTERPRISE=1 "${FULL_BUILD_ARGS[@]}" EMBED_SUF="_enterprise-${{ matrix.goos }}-${{ matrix.goarch }}"
            cp bin/cob-*-embed_enterprise-*.zip "dist/"
            make popcorn_comp ENTERPRISE=1 \
              CC="${{ matrix.cc }}" \
              CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
              EXE_SUF="$EXE_SUF"
            cp "bin/cob_interp_full_enterprise${EXE_SUF}" "dist/enterprise/${{ matrix.output_name }}"
            cp "bin/popcorn_comp_enterprise${EXE_SUF}"    "dist/enterprise/${{ matrix.popcorn_output_name }}"
          fi
        else
          make cob_interp farmer popcorn_comp \
            CC="${{ matrix.cc }}" \
            CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
            EXE_SUF="$EXE_SUF"

          cp "bin/cob_interp${EXE_SUF}" "dist/${{ matrix.output_name }}"

          if [ -f include/drm_pubkey.h ]; then
            mkdir -p dist/enterprise
            make cob_interp popcorn_comp ENTERPRISE=1 \
              CC="${{ matrix.cc }}" \
              CFLAGS="-std=c99 -O2 -Wall -Wextra ${{ matrix.cflags || '' }}" \
              EXE_SUF="$EXE_SUF"
            cp "bin/cob_interp_enterprise${EXE_SUF}"      "dist/enterprise/${{ matrix.output_name }}"
            cp "bin/popcorn_comp_enterprise${EXE_SUF}"    "dist/enterprise/${{ matrix.popcorn_output_name }}"
          fi
        fi

        cp "bin/farmer${EXE_SUF}"       "dist/${{ matrix.farmer_output_name }}"
        cp "bin/popcorn_comp${EXE_SUF}" "dist/${{ matrix.popcorn_output_name }}"

        ls -la dist/

    # Download and bundle the official, host-runnable Zig release for
    # THIS target platform so popcorn_comp works standalone after the
    # user unzips the release (see find_bundled_zig_cc() in
    # src/popcorn_comp.c). If this 404s, Zig's download naming changed
    # upstream and needs rechecking.
    - name: Download and bundle Zig for popcorn_comp
      shell: bash
      run: |
        set -euo pipefail
        ZIG_BASENAME="zig-${{ matrix.zig_target }}-${ZIG_VERSION}"
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          ZIG_FILE="${ZIG_BASENAME}.zip"
        else
          ZIG_FILE="${ZIG_BASENAME}.tar.xz"
        fi
        ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_FILE}"
        echo "Fetching $ZIG_URL"
        curl -fsSL -o "$ZIG_FILE" "$ZIG_URL"

        mkdir -p zig_extracted
        if [ "${{ matrix.zig_ext }}" = "zip" ]; then
          unzip -q "$ZIG_FILE" -d zig_extracted
        else
          tar xf "$ZIG_FILE" -C zig_extracted
        fi

        mkdir -p "staging/${{ matrix.archive_name }}/zig"
        mv "zig_extracted/${ZIG_BASENAME}"/* "staging/${{ matrix.archive_name }}/zig/"
        rm -rf "$ZIG_FILE" zig_extracted

    - name: Package binary and licenses into zip
      shell: bash
      run: |
        mkdir -p staging/${{ matrix.archive_name }}
        cp dist/${{ matrix.output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.farmer_output_name }} staging/${{ matrix.archive_name }}/
        cp dist/${{ matrix.popcorn_output_name }} staging/${{ matrix.archive_name }}/

        # Copy legal folder contents next to the binaries if it exists
        if [ -d "legal" ]; then
          cp -r legal/* staging/${{ matrix.archive_name }}/
        fi

        # Download docs index.html into a docs folder next to cob.exe
        mkdir -p staging/${{ matrix.archive_name }}/docs
        curl -fsSL -o "staging/${{ matrix.archive_name }}/docs/index.html" "https://github.com/Cob-Software-Foundation/Cob-Docs/raw/refs/heads/main/index.html"

        # Copy main repository license(s)
        find . -maxdepth 1 -iname "license*" -exec cp {} staging/${{ matrix.archive_name }}/ \;

        cd staging
        zip -r "../dist/${{ matrix.archive_name }}.zip" ${{ matrix.archive_name }}
        cd ..

    # Enterprise zip: same layout as the free zip (bundled Zig, legal files,
    # farmer) but with the license-gated cob + popcorn_comp. Needs a cob.lic
    # to run. Built only when include/drm_pubkey.h is committed.
    - name: Package Enterprise zip
      if: ${{ hashFiles('include/drm_pubkey.h') != '' }}
      shell: bash
      run: |
        set -euo pipefail
        ENT="cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}"
        mkdir -p "staging/$ENT"
        cp -r "staging/${{ matrix.archive_name }}"/. "staging/$ENT/"
        cp "dist/enterprise/${{ matrix.output_name }}"         "staging/$ENT/${{ matrix.output_name }}"
        cp "dist/enterprise/${{ matrix.popcorn_output_name }}" "staging/$ENT/${{ matrix.popcorn_output_name }}"
        {
          echo "Cob Enterprise build"
          echo "===================="
          echo "cob and popcorn_comp in this archive need a valid cob.lic."
          echo "Put it next to the program, or set the COB_LICENSE environment variable."
          echo "No license? Use the free build: https://cob.pixel-pulse.dev/download.html"
        } > "staging/$ENT/ENTERPRISE-README.txt"
        (cd staging && zip -r "../dist/$ENT.zip" "$ENT")

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/${{ matrix.archive_name }}.zip

    - name: Attest Enterprise Build Provenance
      if: ${{ hashFiles('include/drm_pubkey.h') != '' }}
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip

    - name: Generate individual hash and text fragment
      shell: bash
      run: |
        cd dist
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.sha256"
        sha256sum "${{ matrix.archive_name }}.zip" > "${{ matrix.archive_name }}.zip.hashfrag"

        # Embeddable package, named by `make embed` as
        # cob-<VERSION>-embed-<goos>-<goarch>.zip.
        for f in cob-*-embed-${{ matrix.goos }}-${{ matrix.goarch }}.zip; do
          [ -e "$f" ] || continue
          sha256sum "$f" > "$f.sha256"
          sha256sum "$f" > "$f.hashfrag"
        done

        # Enterprise zip + enterprise embeddable package (if built).
        for f in cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
                 cob-*-embed_enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip; do
          [ -e "$f" ] || continue
          sha256sum "$f" > "$f.sha256"
          sha256sum "$f" > "$f.hashfrag"
        done

    - name: Upload temporary matrix artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.archive_name }}
        if-no-files-found: ignore
        path: |
          dist/${{ matrix.archive_name }}.zip
          dist/${{ matrix.archive_name }}.zip.sha256
          dist/${{ matrix.archive_name }}.zip.hashfrag
          dist/cob-*-embed-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          dist/cob-*-embed-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          dist/cob-*-embed-${{ matrix.goos }}-${{ matrix.goarch }}.zip.hashfrag

    # Enterprise files get their OWN artifact. Its name does not match the
    # deb job's `artifact-cob-linux-*` pattern, and the apt-repo job only
    # downloads `artifact-cob-deb`, so enterprise binaries can never reach
    # the .deb or the apt repository. The release job's `artifact-*`
    # pattern does pick it up, so they are published with the release.
    - name: Upload Enterprise matrix artifacts
      if: ${{ hashFiles('include/drm_pubkey.h') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: artifact-cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}
        if-no-files-found: ignore
        path: |
          dist/cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          dist/cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          dist/cob-enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip.hashfrag
          dist/cob-*-embed_enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          dist/cob-*-embed_enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          dist/cob-*-embed_enterprise-${{ matrix.goos }}-${{ matrix.goarch }}.zip.hashfrag

  # ---------------------------------------------------------------------
  # Debian package. ONE signed .deb that carries every Linux architecture
  # (amd64, i386, arm64, armhf), built from the Linux zips the matrix above
  # already produced. On install, the postinst script keeps the build that
  # matches `dpkg --print-architecture` and deletes the others.
  #
  # Signing: the repository secret GPG_PRIVATE_KEY (an ASCII-armored private
  # key, i.e. `gpg --armor --export-secret-keys <id>`) signs the .deb with a
  # detached signature (cob_<VERSION>_all.deb.asc). If the key has a
  # passphrase, also add a GPG_PASSPHRASE secret. The matching public key is
  # published as cob-gpg-public-key.asc so anyone can verify:
  #     gpg --import cob-gpg-public-key.asc
  #     gpg --verify csf-cob_<VERSION>_all.deb.asc csf-cob_<VERSION>_all.deb
  # The package is named csf-cob (apt package names must be lowercase). The
  # apt-repo job below publishes it as a signed apt repository, so users can
  # run `sudo apt update && sudo apt install csf-cob` after adding the source.
  # ---------------------------------------------------------------------
  deb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

    - name: Download the Linux builds
      uses: actions/download-artifact@v4
      with:
        path: linux-zips
        pattern: artifact-cob-linux-*
        merge-multiple: true

    - name: Assemble the package tree
      shell: bash
      run: |
        set -euo pipefail
        PKG="pkg/csf-cob_${VERSION}_all"
        mkdir -p "$PKG/DEBIAN" "$PKG/usr/lib/cob" "$PKG/usr/bin" "$PKG/usr/share/doc/cob"

        # matrix archive name : Debian architecture name
        for pair in cob-linux-amd64:amd64 cob-linux-386:i386 cob-linux-arm64:arm64 cob-linux-arm32:armhf; do
          archive="${pair%%:*}"
          arch="${pair##*:}"
          unzip -q "linux-zips/${archive}.zip" -d "unz"
          src="unz/${archive}"
          for f in cob farmer popcorn_comp; do
            test -f "$src/$f" || { echo "::error::$f is missing from ${archive}.zip"; exit 1; }
          done
          test -f "$src/zig/zig" || { echo "::error::bundled zig is missing from ${archive}.zip"; exit 1; }

          mkdir -p "$PKG/usr/lib/cob/$arch"
          cp -a "$src/cob" "$src/farmer" "$src/popcorn_comp" "$src/zig" "$PKG/usr/lib/cob/$arch/"
          chmod 755 "$PKG/usr/lib/cob/$arch/cob" "$PKG/usr/lib/cob/$arch/farmer" "$PKG/usr/lib/cob/$arch/popcorn_comp"

          # Licenses and docs are architecture-independent: take them from one build.
          if [ "$arch" = "amd64" ]; then
            find "$src" -mindepth 1 -maxdepth 1 \
              ! -name cob ! -name farmer ! -name popcorn_comp ! -name zig \
              -exec cp -r {} "$PKG/usr/share/doc/cob/" \;
          fi
        done
        cp LICENSE.md "$PKG/usr/share/doc/cob/copyright"
        ls "$PKG/usr/lib/cob"

        # Launchers. They exec the real binary by its full path, so
        # popcorn_comp (which locates its bundled zig/ through
        # /proc/self/exe) finds the zig that sits next to it.
        for tool in cob farmer popcorn_comp; do
          printf '#!/bin/sh\nexec /usr/lib/cob/current/%s "$@"\n' "$tool" > "$PKG/usr/bin/$tool"
          chmod 755 "$PKG/usr/bin/$tool"
        done

        # "Architecture: all" lets this one file install on any machine;
        # postinst then picks the right build.
        cat > "$PKG/DEBIAN/control" <<EOF
        Package: csf-cob
        Conflicts: cob
        Replaces: cob
        Version: ${VERSION}
        Section: devel
        Priority: optional
        Architecture: all
        Maintainer: Cob Software Foundation <noreply@users.noreply.github.com>
        Depends: libc6, libx11-6, libgl1, libxrandr2, libxinerama1, libxcursor1, libxi6
        Homepage: https://github.com/Cob-Software-Foundation/Cob
        Description: Cob programming language toolchain
         Interpreter (cob), native compiler (popcorn_comp) and package
         manager (farmer). This package contains builds for amd64, i386,
         arm64 and armhf; the correct one is selected at install time.
        EOF

        cat > "$PKG/DEBIAN/postinst" <<'EOF'
        #!/bin/sh
        set -e
        [ "$1" = "configure" ] || exit 0

        LIB=/usr/lib/cob
        ARCH=$(dpkg --print-architecture)

        if [ ! -d "$LIB/$ARCH" ]; then
            echo "cob: no build for architecture '$ARCH' in this package" >&2
            echo "cob: available: $(ls $LIB | tr '\n' ' ')" >&2
            exit 1
        fi

        ln -sfn "$ARCH" "$LIB/current"

        # Remove the builds for other architectures to save disk space.
        for d in "$LIB"/*/; do
            name=$(basename "$d")
            [ "$name" = "$ARCH" ] && continue
            [ "$name" = "current" ] && continue
            rm -rf "$d"
        done
        exit 0
        EOF

        cat > "$PKG/DEBIAN/postrm" <<'EOF'
        #!/bin/sh
        set -e
        if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            rm -f /usr/lib/cob/current
            rmdir /usr/lib/cob 2>/dev/null || true
        fi
        exit 0
        EOF
        chmod 755 "$PKG/DEBIAN/postinst" "$PKG/DEBIAN/postrm"

    - name: Build the .deb
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist
        dpkg-deb --root-owner-group -Zxz --build "pkg/csf-cob_${VERSION}_all" "dist/csf-cob_${VERSION}_all.deb"
        dpkg-deb --info "dist/csf-cob_${VERSION}_all.deb"
        cd dist
        sha256sum "csf-cob_${VERSION}_all.deb" > "csf-cob_${VERSION}_all.deb.sha256"
        sha256sum "csf-cob_${VERSION}_all.deb" > "csf-cob_${VERSION}_all.deb.hashfrag"

    # Install the package on this (amd64) runner and actually use it, so a
    # broken package is never signed or released.
    - name: Smoke-test the install
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y "./dist/csf-cob_${VERSION}_all.deb"

        dpkg -s csf-cob | grep -q '^Status: install ok installed'
        ls -l /usr/lib/cob
        test "$(readlink /usr/lib/cob/current)" = "amd64"
        test "$(ls /usr/lib/cob | grep -v '^current$')" = "amd64"

        cat > /tmp/smoke.cob <<'EOF'
        pop("hello from the deb")
        set n = 3
        if n > 5:
            pop("if is wrong")
        elif n > 2:
            pop("elif ok")
        else:
            pop("else is wrong")
        EOF
        EXPECTED="$(printf 'hello from the deb\nelif ok')"

        # interpreter
        OUT="$(cob /tmp/smoke.cob)"
        echo "$OUT"
        test "$OUT" = "$EXPECTED"

        # native compile through the BUNDLED zig (proves zig/ is found
        # next to the real binary, not next to the /usr/bin launcher)
        popcorn_comp /tmp/smoke.strawberry -o /tmp/smoke_native
        OUT="$(/tmp/smoke_native)"
        echo "$OUT"
        test "$OUT" = "$EXPECTED"

        command -v farmer

    - name: Import the GPG signing key
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::The GPG_PRIVATE_KEY repository secret is missing or empty, so the .deb cannot be signed. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::warning::GPG_PRIVATE_KEY is not available to this run (for example a pull request from a fork). The .deb is built but NOT signed."
          echo "SIGN=false" >> "$GITHUB_ENV"
          exit 0
        fi

        export GNUPGHOME="$RUNNER_TEMP/gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        umask 077
        printf '%s' "${GPG_PASSPHRASE:-}" > "$RUNNER_TEMP/gpg-passphrase"

        printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback \
          --passphrase-file "$RUNNER_TEMP/gpg-passphrase" --import

        # Fingerprint of the primary secret key (public information).
        FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="sec"{f=1;next} f&&$1=="fpr"{print $10; exit}')"
        if [ -z "$FPR" ]; then
          echo "::error::No secret key was found after importing GPG_PRIVATE_KEY. It must be an ASCII-armored private key (gpg --armor --export-secret-keys)."
          exit 1
        fi
        echo "Signing key fingerprint: $FPR"

        {
          echo "SIGN=true"
          echo "GNUPGHOME=$GNUPGHOME"
          echo "GPG_PASSFILE=$RUNNER_TEMP/gpg-passphrase"
          echo "GPG_FPR=$FPR"
        } >> "$GITHUB_ENV"

    - name: Sign the .deb
      if: env.SIGN == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GPG_PASSFILE" \
          --local-user "$GPG_FPR" --armor --detach-sign \
          --output "csf-cob_${VERSION}_all.deb.asc" "csf-cob_${VERSION}_all.deb"
        gpg --batch --armor --export "$GPG_FPR" > cob-gpg-public-key.asc

        # Verify exactly like a user would: a brand-new keyring that contains
        # ONLY the published public key.
        VERIFY_HOME="$(mktemp -d)"
        chmod 700 "$VERIFY_HOME"
        gpg --homedir "$VERIFY_HOME" --batch --import cob-gpg-public-key.asc
        gpg --homedir "$VERIFY_HOME" --batch --status-fd 1 \
          --verify "csf-cob_${VERSION}_all.deb.asc" "csf-cob_${VERSION}_all.deb" \
          | tee /tmp/verify.status
        grep VALIDSIG /tmp/verify.status | grep -q "$GPG_FPR"
        rm -rf "$VERIFY_HOME"
        echo "Signature verified against the published public key ($GPG_FPR)."

    - name: Remove the signing key from the runner
      if: always()
      shell: bash
      run: |
        if [ -n "${GNUPGHOME:-}" ]; then
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
        fi
        if [ -n "${GPG_PASSFILE:-}" ]; then rm -f "$GPG_PASSFILE"; fi

    - name: Attest Build Provenance
      if: github.event_name == 'push'
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/csf-cob_${{ env.VERSION }}_all.deb

    - name: Upload the .deb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact-cob-deb
        if-no-files-found: error
        path: |
          dist/*.deb
          dist/*.deb.asc
          dist/*.deb.sha256
          dist/*.deb.hashfrag
          dist/cob-gpg-public-key.asc

  # ---------------------------------------------------------------------
  # Signed apt repository. Publishes a "flat" apt repository as the assets of
  # a release named apt-repo (kept separate from the versioned releases and
  # never marked "latest"), so users can add one line to their apt sources:
  #   https://github.com/<owner>/<repo>/releases/download/apt-repo
  # The newest three .deb versions are kept. The package index and Release
  # file are signed with GPG_PRIVATE_KEY (InRelease + Release.gpg).
  # ---------------------------------------------------------------------
  apt-repo:
    needs: deb
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

    - name: Download the signed .deb
      uses: actions/download-artifact@v4
      with:
        name: artifact-cob-deb
        path: new

    - name: Collect the existing repository files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p repo
        # Older versions stay installable. A missing release (first run) is fine.
        gh release download apt-repo --repo "$GITHUB_REPOSITORY" --dir repo --pattern '*.deb' || echo "No apt-repo release yet; starting a new repository."
        cp new/csf-cob_*_all.deb repo/
        cp new/cob-gpg-public-key.asc repo/
        # keep the newest three versions only
        cd repo
        ls -1 csf-cob_*_all.deb | sort -V | head -n -3 > ../removed.txt || true
        xargs -r rm -f < ../removed.txt
        echo "Versions in the repository:"; ls -1 csf-cob_*_all.deb

    - name: Import the GPG signing key
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
          echo "::error::The GPG_PRIVATE_KEY repository secret is missing or empty, so the apt repository cannot be signed."
          exit 1
        fi
        export GNUPGHOME="$RUNNER_TEMP/gnupg"
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        umask 077
        printf '%s' "${GPG_PASSPHRASE:-}" > "$RUNNER_TEMP/gpg-passphrase"
        printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --pinentry-mode loopback \
          --passphrase-file "$RUNNER_TEMP/gpg-passphrase" --import
        FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="sec"{f=1;next} f&&$1=="fpr"{print $10; exit}')"
        if [ -z "$FPR" ]; then
          echo "::error::No secret key was found after importing GPG_PRIVATE_KEY."
          exit 1
        fi
        echo "Signing key fingerprint: $FPR"
        {
          echo "GNUPGHOME=$GNUPGHOME"
          echo "GPG_PASSFILE=$RUNNER_TEMP/gpg-passphrase"
          echo "GPG_FPR=$FPR"
        } >> "$GITHUB_ENV"

    - name: Build and sign the repository index
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y apt-utils
        cd repo
        rm -f Packages Packages.gz Release InRelease Release.gpg
        apt-ftparchive packages . > Packages
        gzip -9kf Packages
        apt-ftparchive \
          -o APT::FTPArchive::Release::Origin="Cob Software Foundation" \
          -o APT::FTPArchive::Release::Label="Cob" \
          -o APT::FTPArchive::Release::Suite="stable" \
          -o APT::FTPArchive::Release::Codename="stable" \
          -o APT::FTPArchive::Release::Description="Cob apt repository" \
          release . > Release
        gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GPG_PASSFILE" \
          --local-user "$GPG_FPR" --clearsign --output InRelease Release
        gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GPG_PASSFILE" \
          --local-user "$GPG_FPR" --armor --detach-sign --output Release.gpg Release
        ls -l

    # Use the repository exactly like a user would: a fresh apt source with
    # ONLY the published public key must accept the signature and offer this version.
    - name: Check the repository with apt
      shell: bash
      run: |
        set -euo pipefail
        sudo install -d -m 755 /etc/apt/keyrings
        sudo cp "$PWD/repo/cob-gpg-public-key.asc" /etc/apt/keyrings/csf-cob-test.asc
        echo "deb [signed-by=/etc/apt/keyrings/csf-cob-test.asc] file:$PWD/repo ./" | sudo tee /etc/apt/sources.list.d/csf-cob-test.list
        sudo apt-get update \
          -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/csf-cob-test.list \
          -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
        apt-cache policy csf-cob | tee /tmp/policy.txt
        grep -q "Candidate: ${VERSION}" /tmp/policy.txt
        sudo rm -f /etc/apt/sources.list.d/csf-cob-test.list /etc/apt/keyrings/csf-cob-test.asc

    - name: Publish the repository
      shell: bash
      run: |
        set -euo pipefail
        if ! gh release view apt-repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create apt-repo --repo "$GITHUB_REPOSITORY" \
            --title "Cob apt repository" --latest=false \
            --notes "Signed apt repository for the csf-cob package. Not meant to be downloaded by hand; see the install instructions in the latest Cob release."
        fi
        # delete the versions that were pruned, then upload everything
        if [ -s removed.txt ]; then
          while read -r f; do gh release delete-asset apt-repo "$f" --repo "$GITHUB_REPOSITORY" --yes || true; done < removed.txt
        fi
        cd repo
        gh release upload apt-repo --repo "$GITHUB_REPOSITORY" --clobber \
          Packages Packages.gz Release InRelease Release.gpg cob-gpg-public-key.asc csf-cob_*_all.deb

    - name: Remove the signing key from the runner
      if: always()
      shell: bash
      run: |
        if [ -n "${GNUPGHOME:-}" ]; then
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
        fi
        if [ -n "${GPG_PASSFILE:-}" ]; then rm -f "$GPG_PASSFILE"; fi

  release:
    needs: [build, deb]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-binaries
        pattern: artifact-*
        merge-multiple: true

    - name: Stitch checksums document
      run: |
        cd all-binaries
        cat *.hashfrag > checksums.txt
        rm *.hashfrag
        cat checksums.txt

    - name: Create combined GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cob v${{ steps.version.outputs.version }}
        body_path: Release.txt
        files: |
          all-binaries/*
