name: Build .deb

# Builds Cob for every Linux architecture, then packs all of them into ONE
# .deb. On install, the postinst script detects the machine's architecture
# (dpkg --print-architecture), keeps the matching build, and deletes the rest.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"   # keep in sync with build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - debarch: amd64
            toolchain: native
            cc: gcc
            ar: ar
            zig_target: x86_64-linux
          - debarch: i386
            toolchain: multilib
            cc: gcc -m32
            ar: ar
            apt_pkg: gcc-multilib
            zig_target: x86-linux
            x11_arch: i386
          - debarch: arm64
            toolchain: cross
            cc: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar
            apt_pkg: gcc-aarch64-linux-gnu
            zig_target: aarch64-linux
            x11_arch: arm64
          - debarch: armhf
            toolchain: cross
            cc: arm-linux-gnueabihf-gcc
            ar: arm-linux-gnueabihf-ar
            apt_pkg: gcc-arm-linux-gnueabihf
            zig_target: arm-linux
            x11_arch: armhf

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install compiler toolchain
        if: matrix.apt_pkg != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkg }}

      - name: Install X11/OpenGL dev headers (native)
        if: matrix.x11_arch == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Install X11/OpenGL dev headers (foreign arch)
        if: matrix.x11_arch != ''
        run: |
          sudo dpkg --add-architecture ${{ matrix.x11_arch }}
          if [ "${{ matrix.x11_arch }}" != "i386" ]; then
            # arm64/armhf are only served from ports.ubuntu.com
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              sudo sed -i '/^Types: deb$/a Architectures: amd64 i386' /etc/apt/sources.list.d/ubuntu.sources
            fi
            CODENAME=$(lsb_release -cs)
            for pocket in "" -updates -backports -security; do
              echo "deb [arch=arm64,armhf signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}${pocket} main universe restricted multiverse"
            done | sudo tee /etc/apt/sources.list.d/ubuntu-ports.list > /dev/null
          fi
          sudo apt-get update
          A=${{ matrix.x11_arch }}
          sudo apt-get install -y --no-install-recommends \
            libx11-dev:$A libgl1-mesa-dev:$A libxrandr-dev:$A \
            libxinerama-dev:$A libxcursor-dev:$A libxi-dev:$A

      - name: Build cob, farmer, popcorn_comp
        run: |
          set -euo pipefail
          # Same overrides build.yml uses for Linux full builds.
          make cob_interp_full \
            CC="${{ matrix.cc }}" AR="${{ matrix.ar }}" \
            WINDOW_LIBS="-lGL -lm -lpthread -ldl -lrt -lX11" \
            SQLITE_LIB="vendor/SQLite/libsqlite3-unix.a" \
            PLATFORM_OS="LINUX"

          # Cross compilers need the -m32 etc. folded into CC; farmer and
          # popcorn_comp are plain C99 so CFLAGS can be set normally.
          make farmer popcorn_comp \
            CC="${{ matrix.cc }}" \
            CFLAGS="-std=c99 -O2 -Wall -Wextra"

          mkdir -p out/${{ matrix.debarch }}
          cp bin/cob_interp_full out/${{ matrix.debarch }}/cob
          cp bin/farmer          out/${{ matrix.debarch }}/farmer
          cp bin/popcorn_comp    out/${{ matrix.debarch }}/popcorn_comp

      - name: Bundle Zig for popcorn_comp
        run: |
          set -euo pipefail
          BASE="zig-${{ matrix.zig_target }}-${ZIG_VERSION}"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/${BASE}.tar.xz"
          mkdir zig_extracted
          tar xf zig.tar.xz -C zig_extracted
          mkdir -p out/${{ matrix.debarch }}/zig
          mv zig_extracted/${BASE}/* out/${{ matrix.debarch }}/zig/

      - uses: actions/upload-artifact@v4
        with:
          name: cob-${{ matrix.debarch }}
          path: out/${{ matrix.debarch }}
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all architecture builds
        uses: actions/download-artifact@v4
        with:
          path: arches
          pattern: cob-*

      - name: Assemble package tree
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PKG=pkg/cob_${VERSION}_all
          mkdir -p $PKG/DEBIAN $PKG/usr/lib/cob $PKG/usr/bin \
                   $PKG/usr/share/doc/cob

          # One directory per architecture, named by its Debian arch.
          for d in arches/cob-*; do
            arch=${d#arches/cob-}
            cp -a "$d" "$PKG/usr/lib/cob/$arch"
            chmod 755 "$PKG/usr/lib/cob/$arch/cob" \
                      "$PKG/usr/lib/cob/$arch/farmer" \
                      "$PKG/usr/lib/cob/$arch/popcorn_comp"
          done
          ls $PKG/usr/lib/cob

          # Launchers in /usr/bin. They exec the real binary by full path so
          # popcorn_comp can still find its bundled zig/ directory.
          for tool in cob farmer popcorn_comp; do
            printf '#!/bin/sh\nexec /usr/lib/cob/current/%s "$@"\n' "$tool" > $PKG/usr/bin/$tool
            chmod 755 $PKG/usr/bin/$tool
          done

          # Docs / licences
          cp LICENSE.md $PKG/usr/share/doc/cob/copyright
          [ -d legal ] && cp -r legal $PKG/usr/share/doc/cob/

          # Control file. "all" lets one .deb install on every machine;
          # postinst then picks the right binaries.
          cat > $PKG/DEBIAN/control <<EOF
          Package: cob
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: all
          Maintainer: Cob Software Foundation <noreply@users.noreply.github.com>
          Depends: libc6, libx11-6, libgl1, libxrandr2, libxinerama1, libxcursor1, libxi6
          Homepage: https://github.com/Cob-Software-Foundation/Cob
          Description: Cob programming language toolchain
           Interpreter (cob), native compiler (popcorn_comp) and package
           manager (farmer). This package contains builds for amd64, i386,
           arm64 and armhf; the correct one is selected at install time.
          EOF
          # strip the YAML indentation from the heredoc
          sed -i 's/^          //' $PKG/DEBIAN/control

          # postinst: pick the right arch, delete the others.
          cat > $PKG/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          [ "$1" = "configure" ] || exit 0

          LIB=/usr/lib/cob
          ARCH=$(dpkg --print-architecture)

          if [ ! -d "$LIB/$ARCH" ]; then
              echo "cob: no build for architecture '$ARCH' in this package" >&2
              echo "cob: available: $(ls $LIB | tr '\n' ' ')" >&2
              exit 1
          fi

          ln -sfn "$ARCH" "$LIB/current"

          # Remove the builds for other architectures to save disk space.
          for d in "$LIB"/*/; do
              name=$(basename "$d")
              [ "$name" = "$ARCH" ] && continue
              [ "$name" = "current" ] && continue
              rm -rf "$d"
          done
          exit 0
          EOF
          sed -i 's/^          //' $PKG/DEBIAN/postinst
          chmod 755 $PKG/DEBIAN/postinst

          # prerm/postrm: clean up the symlink
          cat > $PKG/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              rm -f /usr/lib/cob/current
              rmdir /usr/lib/cob 2>/dev/null || true
          fi
          exit 0
          EOF
          sed -i 's/^          //' $PKG/DEBIAN/postrm
          chmod 755 $PKG/DEBIAN/postrm

      - name: Build .deb
        run: |
          set -euo pipefail
          mkdir -p dist
          dpkg-deb --root-owner-group -Zxz --build \
            pkg/cob_${VERSION}_all dist/cob_${VERSION}_all.deb
          dpkg-deb --info dist/cob_${VERSION}_all.deb
          sha256sum dist/cob_${VERSION}_all.deb > dist/cob_${VERSION}_all.deb.sha256

      - name: Lint package
        run: |
          sudo apt-get install -y lintian
          lintian dist/cob_${VERSION}_all.deb || true

      - name: Smoke test install (amd64 runner)
        run: |
          sudo apt-get install -y ./dist/cob_${VERSION}_all.deb
          ls -l /usr/lib/cob
          test -L /usr/lib/cob/current
          cob --version || cob --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: cob-deb
          path: dist/*

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
