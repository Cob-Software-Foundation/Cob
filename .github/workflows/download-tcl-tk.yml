name: Secure Tcl/Tk Ingestion & Attested Build

on:
  schedule:
    - cron: '0 0 * * *' # Checks upstream repositories every day at midnight
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write # Required for CodeQL analysis reporting
  pull-requests: write    # Required to open the sync PR

jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Ingest Upstream Tcl and Tk Source
        run: |
          mkdir -p src/tcl src/tk
          
          # Clone official Tcl and Tk repositories from GitHub
          git clone --depth 1 https://github.com/tcltk/tcl.git temp-tcl
          git clone --depth 1 https://github.com/tcltk/tk.git temp-tk
          
          # Sync and overwrite files into respective directories
          rsync -av --delete --exclude='.git' temp-tcl/ src/tcl/
          rsync -av --delete --exclude='.git' temp-tk/ src/tk/
          
          rm -rf temp-tcl temp-tk

      # --- SECURITY SHIELD ---
      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'cpp'
          queries: security-extended,security-and-quality


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev

      - name: Attempt Build (Required for CodeQL analysis)
        run: |
          # Build Tcl first, then Tk
          cd src/tcl/unix
          ./configure
          make
          cd ../../tk/unix
          ./configure --with-tcl=../../tcl/unix --disable-bidi
          make

      - name: Perform CodeQL Static Scan
        uses: github/codeql-action/analyze@v3

      # --- ATTESTATION ---
      - name: Archive Verified Production Binaries
        run: |
          mkdir -p dist
          # Copy core built binaries or libraries as needed
          cp src/tcl/unix/libtcl* dist/ 2>/dev/null || true
          cp src/tcl/unix/tclsh dist/my-verified-tclsh 2>/dev/null || true

      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/my-verified-tclsh'

      # --- OPEN A PULL REQUEST ---
      - name: Open pull request with upstream changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-user-name: github-actions[bot]
          commit-user-email: 41898282+github-actions[bot]@users.noreply.github.com
          add-paths: |
            src/tcl
            src/tk
          commit-message: "Automated Tcl/Tk upstream sync"
          branch: automated/tcl-tk-upstream-sync
          delete-branch: true
          title: "Automated Tcl/Tk upstream sync (github.com/tcltk)"
          body: |
            Nightly sync from official Tcl/Tk repositories into `src/tcl/` and `src/tk/`.

            **This is an unpinned upstream clone.** Please review the diff before merging -- 
            this PR is the review gate.

            CodeQL results for this run: see the Security tab.