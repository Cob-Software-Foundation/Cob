name: Deploy Pages

# Publishes docs/ (the Cob landing page + farmer's static package
# registry) to GitHub Pages on every push to main that touches it.
# Requires Pages to be enabled once in repo Settings -> Pages, with
# "Source" set to "GitHub Actions" (not "Deploy from a branch") --
# that's a one-time manual step this workflow can't do for you.

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
