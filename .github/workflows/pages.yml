name: Deploy Pages

# Publishes docs/ (the Cob landing page + farmer's static package
# registry) to GitHub Pages on every push to main that touches it.
# Requires Pages to be enabled once in repo Settings -> Pages, with
# "Source" set to "GitHub Actions" (not "Deploy from a branch") --
# that's a one-time manual step this workflow can't do for you.

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "crates/**"
      - "stdlib-rs/**"
      - "stdlib/*.cob"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      # docs/play/cob_interp.wasm is .gitignore'd on purpose -- it is a build
      # output of `make play` (crates/cob-wasm compiled to WebAssembly), not
      # something to keep committed and let drift from the interpreter source.
      # docs/play/cob_interp.js, the hand-written loader, IS committed. The
      # module is built fresh here, right before the artifact upload below.
      - name: Install the wasm32 Rust target
        run: rustup target add wasm32-unknown-unknown

      # builds docs/play/cob_interp.wasm, then checks it against the native
      # interpreter under Node -- a broken playground must not get deployed
      - name: Build the WASM playground and test it (`make wasm-test`)
        run: make wasm-test

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
