name: Deploy Pages

# Publishes docs/ (the Cob landing page + farmer's static package
# registry) to GitHub Pages on every push to main that touches it.
# Requires Pages to be enabled once in repo Settings -> Pages, with
# "Source" set to "GitHub Actions" (not "Deploy from a branch") --
# that's a one-time manual step this workflow can't do for you.

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      # docs/play/'s two generated files (cob_interp.js, cob_interp.wasm)
      # are .gitignore'd on purpose -- they're a build output of `make
      # play`, not something to keep committed and let drift from
      # src/cob_interp.c. Built fresh here, right before the artifact
      # upload below, with the Makefile's own default WASM_ENV
      # (web,worker) -- the one real browsers need; CI's own test_wasm
      # job in build.yml overrides this to `node` purely so it can run
      # the module under a Node-based smoke test, and that override must
      # never leak into what actually gets deployed here.
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          # Keep this in sync with the pin in build.yml's test_wasm job
          # -- see the comment there for why it's pinned, not "latest".
          version: 4.0.17

      - name: Build the WASM playground (`make play`)
        run: make play

      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
