[package]
name = "cob-drm"
description = "Cob Enterprise license verification (verify + machine binding); also used by cob_sign"
version.workspace = true
edition.workspace = true
license-file.workspace = true
build = "build.rs"

[dependencies]
blake2 = "=0.10.6"
sha2 = "=0.10.8"
curve25519-dalek = { version = "=4.1.1", default-features = false, features = ["alloc"] }
# Pinned: zeroize >= 1.8 needs Cargo's edition2024 (1.85+). Dropping this pin is
# fine once the project's minimum Rust moves past that.
zeroize = { version = "=1.7.0", default-features = false }
