[package]
name = "cob-wasm"
description = "The Cob interpreter for the browser playground (WebAssembly)"
version = "0.0.9"
edition = "2021"
license-file = "../../LICENSE.md"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
cob-abi = { path = "../cob-abi" }
cob-core = { path = "../cob-core" }
porch = { path = "../../stdlib-rs/porch" }
cornmath = { path = "../../stdlib-rs/cornmath" }
kernels = { path = "../../stdlib-rs/kernels" }
almanac = { path = "../../stdlib-rs/almanac" }

# Built for wasm32-unknown-unknown, so it lives outside the main workspace
# (`cargo build --workspace` on a normal machine must not try to link it).
# Build it with `make wasm`.
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
