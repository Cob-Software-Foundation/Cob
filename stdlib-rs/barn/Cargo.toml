[package]
name = "barn"
description = "Cob standard library module: barn (raylib + raygui windows)"
version = "0.0.9"
edition = "2021"
license-file = "../../LICENSE.md"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
cob-abi = { path = "../../crates/cob-abi" }

[build-dependencies]
cc = "=1.0.83"

# barn is NOT part of the main workspace: it needs X11 + OpenGL dev headers (and
# a display to run), which an ordinary `cargo build --workspace` must not
# require. Build it with `make stdlib-barn`.
[workspace]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
